global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The app exposes Micrometer metrics at /actuator/prometheus.
  # When running via `make run` the host.docker.internal address reaches the
  # locally-running Spring Boot process.  When the app is added to the compose
  # network, change the target to `app:8080`.
  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: "payment-service"
          environment: "local"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
