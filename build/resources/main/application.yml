spring:
  application:
    name: payment-service-template

  # Virtual threads — turns every blocking thread into a virtual thread.
  # Combined with spring-kafka and spring-data-jdbc this gives high concurrency at low cost.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${POSTGRES_USER:payment}
    password: ${POSTGRES_PASSWORD:payment}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      connection-timeout: 10000
      validation-timeout: 3000

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647      # let Kafka exhaust delivery.timeout.ms; don't cap retries
      properties:
        enable.idempotence: "true"
        delivery.timeout.ms: "120000"
        max.in.flight.requests.per.connection: "5"
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: earliest
      enable-auto-commit: false       # manual ack via AckMode.RECORD
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: RECORD

  # Graceful shutdown: drain in-flight requests before stopping
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ─── Actuator / Observability ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness  /actuator/health/readiness
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    ch.example.template: INFO
  # Structured JSON logging is activated via logback-spring.xml when the profile
  # is NOT "local".  See src/main/resources/logback-spring.xml.
