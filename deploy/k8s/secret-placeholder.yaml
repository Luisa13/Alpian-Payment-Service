# PLACEHOLDER — do NOT store real secrets here.
# In production, use GCP Secret Manager with Workload Identity or Sealed Secrets.
#
# To create the secret manually (for local/staging only):
#   kubectl create secret generic payment-service-secret \
#     --from-literal=POSTGRES_USER=<user> \
#     --from-literal=POSTGRES_PASSWORD=<password>
#
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
