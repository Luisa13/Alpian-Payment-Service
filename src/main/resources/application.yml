spring:
  application:
    name: payment-service-template

  # Virtual threads — turns every blocking thread into a virtual thread.
  # Combined with spring-kafka and spring-data-jdbc this gives high concurrency at low cost.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${POSTGRES_USER:payment}
    password: ${POSTGRES_PASSWORD:payment}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      connection-timeout: 10000
      validation-timeout: 3000

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647      # let Kafka exhaust delivery.timeout.ms; don't cap retries
      properties:
        enable.idempotence: "true"
        delivery.timeout.ms: "10000"
        request.timeout.ms: "5000"
        max.block.ms: "5000"
        max.in.flight.requests.per.connection: "5"
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: earliest
      enable-auto-commit: false       # manual ack via AckMode.RECORD
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: RECORD

  # Graceful shutdown: drain in-flight requests before stopping
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ─── Application settings ────────────────────────────────────────────────────
app:
  outbox:
    relay-interval-ms: 500        # outbox relay poll interval
    ack-timeout-ms: 15000         # how long the relay waits for a Kafka ack per record
    claim-ttl-ms: 30000           # rows claimed but not published within this window are reclaimed (crash recovery)
  notification:
    group-id: payment-notifications
  retry:                         # whole-transaction retry on deadlock / lock timeout
    max-attempts: 4
    base-backoff-ms: 20
  rail:
    timeout: 2s                  # hard limit for a settlement rail call
    callback:
      hmac-secret: ${RAIL_CALLBACK_HMAC_SECRET:dev-rail-callback-secret-change-me}
    simulated:                   # the simulated external rail (receiver is an IBAN)
      delay: 100ms
      delivery-delay: 1s
      rejection-rate: 0.05
      timeout-rate: 0.05
  recovery:                      # stale-payment recovery job
    interval-ms: 10000           # run every 10 s
    stale-after: 30s             # well above the rail timeout (app.rail.timeout)
    max-attempts: 10             # payments retried this many times without a definitive answer are left for manual review
  kafka:
    topics:
      partitions: 6
      replicas: 3
    consumer-retry:              # DLT error-handler backoff (exponential)
      initial-interval-ms: 500
      multiplier: 2.0
      max-attempts: 3

# ─── Actuator / Observability ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness  /actuator/health/readiness
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    ch.alpian.payment: INFO
  # Structured JSON logging is activated via logback-spring.xml when the profile
  # is NOT "local".  See src/main/resources/logback-spring.xml.
