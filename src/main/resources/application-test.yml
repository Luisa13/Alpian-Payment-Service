# ─── Test profile ─────────────────────────────────────────────────────────────
# @ServiceConnection in IntegrationTestBase overrides datasource.url and
# kafka.bootstrap-servers automatically — no manual overrides needed here.

logging:
  level:
    root: WARN
    ch.alpian.payment: DEBUG
    org.springframework.kafka: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN

# Short outbox interval so integration tests don't wait long; a deterministic rail (always settles).
spring:
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 1
      connection-timeout: 30000

app:
  kafka:
    topics:
      replicas: 1
  outbox:
    relay-interval-ms: 100
  rail:
    callback:
      hmac-secret: test-rail-callback-secret
    simulated:
      delay: 0ms
      delivery-delay: 50ms
      rejection-rate: 0
      timeout-rate: 0
