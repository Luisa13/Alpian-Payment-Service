openapi: "3.1.0"

info:
  title: Payment Service API
  version: "1.0.0"
  description: |
    **Idempotency**: `POST /api/v1/payments` requires an `Idempotency-Key` header (1-64 characters).
    Replaying the same key with the same body returns the stored payment (`200`).
    The same key with a different body returns `422` with code `IDEMPOTENCY_KEY_REUSED`.

    **Settlement**: a payment is reserved and settled inside the request.
    `201` = final (`COMPLETED` or `FAILED`), `202` = funds held, settlement still pending (`RESERVED`),
    `422` = rejected at intake (`REJECTED`, e.g. insufficient funds).

    **Error format**: all errors follow RFC 9457 `ProblemDetail` with a stable `code` property.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Payments
    description: Payment operations
  - name: Accounts
    description: Account read access
  - name: Internal
    description: Internal callbacks from settlement rails

paths:

  /api/v1/payments:
    post:
      tags: [Payments]
      summary: Create a payment
      operationId: createPayment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            example:
              amount: "100.00"
              currency: "CHF"
              senderAccountId: "a0000000-0000-0000-0000-000000000001"
              receiverAccountId: "a0000000-0000-0000-0000-000000000002"
      responses:
        "200":
          description: Idempotent replay; the body shows the payment's current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "201":
          description: Payment settled inside the request (COMPLETED or FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "202":
          description: Funds held, settlement not confirmed yet (RESERVED)
          headers:
            Location:
              description: URL of the payment
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Rejected (insufficient funds, unknown account, currency mismatch) or idempotency key reused with a different body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: Unexpected error (no stack trace exposed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "404":
          description: Payment not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get an account with its balances
      operationId: getAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "404":
          description: Account not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /internal/rail/callbacks:
    post:
      tags: [Internal]
      summary: Receive settlement callback from an external rail
      operationId: handleRailCallback
      parameters:
        - name: X-Rail-Signature
          in: header
          required: true
          description: HMAC-SHA256 hex signature of the callback payload
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RailCallbackRequest"
      responses:
        "200":
          description: Idempotent replay — callback already applied
        "204":
          description: Callback applied
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Invalid or missing HMAC signature
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Payment not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Callback conflicts with an already finalized payment outcome
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key that makes the request safe to retry
      schema:
        type: string
        minLength: 1
        maxLength: 64
    CorrelationId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation id echoed back in the response
      schema:
        type: string

  schemas:

    CreatePaymentRequest:
      type: object
      description: The receiver is either `receiverAccountId` (one of our accounts) or `receiverIban` (external), never both.
      required: [amount, currency, senderAccountId]
      properties:
        amount:
          type: string
          description: Decimal string, greater than zero, at most 2 decimal places
          pattern: "^\\d+(\\.\\d{1,2})?$"
          example: "100.00"
        currency:
          type: string
          description: ISO 4217 currency code
          pattern: "^[A-Z]{3}$"
          example: "CHF"
        senderAccountId:
          type: string
          format: uuid
        receiverAccountId:
          type: string
          format: uuid
        receiverIban:
          type: string
          pattern: "^[A-Za-z]{2}\\d{2}[A-Za-z0-9 ]{11,30}$"
          example: "CH9300762011623852957"

    PaymentResponse:
      type: object
      required: [id, amount, currency, status, senderAccountId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
          example: "100.00"
        currency:
          type: string
          example: "CHF"
        status:
          type: string
          enum: [REJECTED, RESERVED, SUBMITTED, COMPLETED, FAILED]
        failureReason:
          type: string
          nullable: true
          description: INSUFFICIENT_FUNDS or RAIL_REJECTED
        senderAccountId:
          type: string
          format: uuid
        receiverAccountId:
          type: string
          format: uuid
          nullable: true
        receiverIban:
          type: string
          nullable: true
        railReference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    RailCallbackRequest:
      type: object
      required: [eventId, paymentId, outcome]
      properties:
        eventId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [SETTLED, REJECTED]
        railReference:
          type: string
          nullable: true

    AccountResponse:
      type: object
      required: [id, ownerName, accountType, currency, balance, availableBalance]
      properties:
        id:
          type: string
          format: uuid
        ownerName:
          type: string
        accountType:
          type: string
          enum: [CUSTOMER, CLEARING]
        currency:
          type: string
          example: "CHF"
        balance:
          type: string
          example: "10000.00"
        availableBalance:
          type: string
          description: Balance minus funds on hold
          example: "9900.00"

    # RFC 9457 ProblemDetail with a stable machine-readable code
    ProblemDetail:
      type: object
      required: [code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: Stable error code, safe to switch on
          enum:
            - VALIDATION_ERROR
            - MALFORMED_REQUEST
            - MISSING_HEADER
            - PAYMENT_NOT_FOUND
            - ACCOUNT_NOT_FOUND
            - UNKNOWN_ACCOUNT
            - CURRENCY_MISMATCH
            - INSUFFICIENT_FUNDS
            - IDEMPOTENCY_KEY_REUSED
            - CONCURRENT_MODIFICATION
            - INVALID_SIGNATURE
            - CALLBACK_CONFLICT
            - INTERNAL_ERROR
        paymentId:
          type: string
          format: uuid
          description: Present when a payment was rejected (code is the rejection reason)
        violations:
          type: object
          description: Field path to error message (VALIDATION_ERROR only)
          additionalProperties:
            type: string
        errorReference:
          type: string
          description: Opaque reference for server-side log correlation (500 only)
